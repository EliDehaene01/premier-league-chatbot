# Eval gate: a change to how the chatbot answers must still pass the full
# chat_v1 evals (165 cases, thresholds in evals/thresholds.yaml, never lowered to pass). The
# 25-case smoke subset was tried first: with 1 to 4 cases per evaluator one answer flips it.
#
# It needs the Azure keys as repository secrets (Settings > Secrets and variables > Actions):
# AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, CONTENT_SAFETY_ENDPOINT, CONTENT_SAFETY_API_KEY,
# and the variables AZURE_OPENAI_CHAT_DEPLOYMENT and AZURE_OPENAI_EMBEDDING_DEPLOYMENT.
# Only people with write access to the repository can start it, so nobody else can spend
# them. Without the secrets the job says so and skips. One run: the season is ingested into a
# throwaway Postgres (goldens are SQL run at eval time), the news index is built (about $0.01)
# and the full run costs about $0.90, capped at $1.50.
name: Eval gate

# Runs on pull requests that change how the chatbot answers (Eli, 2026-11-21, after prompt v4
# passed). Every run costs about $0.90 of Azure credit, so it is guarded:
# - only for the answer path (model calls, RAG, prompts, tools, chat loop, MCP server, evals),
#   not for test-only or docs-only changes;
# - never on draft pull requests: iterate as a draft, then "Ready for review" runs it once;
# - a new push cancels the run still going for the previous one.
# It can still be started by hand from Actions > Eval gate > Run workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/llm/**"
      - "backend/rag/**"
      - "backend/prompts/**"
      - "backend/tools/**"
      - "backend/chat.py"
      - "mcp_server/**"
      - "evals/**"
      - "!**/test_*.py"
      - "!evals/results/**"
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plc
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: plc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plc" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://plc:ci-only@localhost:5432/plc
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      CONTENT_SAFETY_ENDPOINT: ${{ secrets.CONTENT_SAFETY_ENDPOINT }}
      CONTENT_SAFETY_API_KEY: ${{ secrets.CONTENT_SAFETY_API_KEY }}
    steps:
      - name: Check the Azure secrets are configured
        id: keys
        run: |
          if [ -n "$AZURE_OPENAI_API_KEY" ] && [ -n "$CONTENT_SAFETY_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Eval gate skipped: the Azure secrets are not set for this repository (or this is a fork)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.keys.outputs.ok == 'true'
        run: pip install -e ".[eval]"
      - name: Ingest the current season
        if: steps.keys.outputs.ok == 'true'
        run: python -m ingestion backfill --summary ingest.json
      - name: Build the news index
        if: steps.keys.outputs.ok == 'true'
        run: python -m backend.rag.build_index
      - name: Evals (chat_v1)
        if: steps.keys.outputs.ok == 'true'
        run: python -m evals.run --dataset chat_v1 --max-cost-usd 1.5 --report eval-report.md
      - name: Report
        if: always() && steps.keys.outputs.ok == 'true'
        run: |
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat eval-report.md || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.keys.outputs.ok == 'true'
        with:
          name: eval-report
          path: |
            eval-report.md
            ingest.json
            evals/results/*.json
