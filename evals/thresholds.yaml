# Minimum scores for `python -m evals.run`; it exits non-zero below any of them.
# Set from the full chat_v1 run 20261121T155251Z (prompt v2):
# each value is the measured score minus one case of slack, rounded down to 0.05, so
# a single flaky case does not fail the gate but a real regression does. Never raise a
# value above what a full run achieves, and never lower one to get a run green.
# Category minimums apply to full runs only (a smoke subset has 1-3 cases per category).
