[project]
name = "premier-league-chatbot"
version = "0.1.0"
description = "Premier League chatbot: tool calling for stats, RAG over official news articles."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.60",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # zoneinfo data on Windows
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]
eval = ["azure-ai-evaluation>=1.18"]  # LLM judges; only the eval runner imports it

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "backend*", "evals*"]

[tool.setuptools.package-data]
"backend.prompts" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = [
    "live: calls the real Premier League APIs (set PLC_LIVE_TESTS=1)",
    "db: needs the compose Postgres (skipped when unreachable, except in CI)",
]
